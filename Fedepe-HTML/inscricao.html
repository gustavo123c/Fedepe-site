<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscrição - Copa FEDEPE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">Copa FEDEPE de Esports</div>
    <nav>
      <a href="index.html">Início</a>
      <a href="campeonatos.html" class="ativo">Campeonatos</a>
      <a href="transmissoes.html">Transmissões</a>
      <a href="ranking.html">Ranking</a>
      <a href="login.html" class="btn btn-amarelo btn-pequeno">Entrar</a>
    </nav>
  </header>

  <main class="pagina-estreita">
    <a href="campeonatos.html" class="btn btn-borda btn-pequeno btn-voltar">← Voltar para campeonatos</a>

    <!-- Campeonato não encontrado -->
    <div class="painel" id="nao-encontrado" hidden>
      <h1>Campeonato não encontrado</h1>
      <p class="subtitulo">O link pode estar errado ou o campeonato não existe mais.</p>
    </div>

    <div class="painel" id="conteudo" hidden>
      <div class="insc-topo">
        <div class="icone icone-grande" id="i-icone"></div>
        <div class="insc-titulo">
          <small class="jogo-nome" id="i-jogo"></small>
          <h1 id="i-titulo"></h1>
        </div>
        <span class="tag" id="i-tag"></span>
      </div>

      <p class="insc-descricao" id="i-desc"></p>

      <div class="grade-info">
        <div class="info-box"><small>Início</small><strong id="i-inicio"></strong></div>
        <div class="info-box"><small>Fim</small><strong id="i-fim"></strong></div>
        <div class="info-box"><small>Inscrições até</small><strong id="i-ate"></strong></div>
        <div class="info-box"><small>Formato</small><strong id="i-formato"></strong></div>
        <div class="info-box"><small>Vagas</small><strong id="i-vagas"></strong></div>
        <div class="info-box"><small>Premiação</small><strong id="i-premio"></strong></div>
      </div>

      <div class="regras-chave" id="i-regras-chave">
        <div>
          <h3>Regras principais</h3>
          <ul class="lista-regras" id="i-regras"></ul>
        </div>
        <div id="i-chave-bloco" hidden>
          <h3>Chaveamento (exemplo)</h3>
          <div class="chaveamento" id="i-chave"></div>
        </div>
      </div>

      <p id="msg-insc" class="auth-msg" role="alert" hidden></p>
      <button type="button" class="btn btn-amarelo btn-largo" id="confirmar-inscricao">Confirmar inscrição</button>
    </div>
  </main>

  <script src="campeonatos-data.js"></script>
  <script src="auth.js"></script>
  <script>
    function el(tag, cls, texto) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (texto !== undefined) e.textContent = texto;
      return e;
    }
    function set(id, t) { document.getElementById(id).textContent = t; }

    var id = new URLSearchParams(location.search).get('id');
    if (!id) location.replace('campeonatos.html');   // aberta sem escolher campeonato
    var c = CAMPEONATOS.find(function (x) { return x.id === id; });

    if (!c) {
      document.getElementById('nao-encontrado').hidden = false;
    } else {
      document.title = c.titulo + ' - Copa FEDEPE';
      document.getElementById('conteudo').hidden = false;
      document.getElementById('i-icone').classList.add(c.jogo);

      set('i-jogo', c.jogoNome); set('i-titulo', c.titulo); set('i-desc', c.descricao);
      set('i-inicio', c.inicio); set('i-fim', c.fim); set('i-ate', c.inscricoesAte);
      set('i-formato', c.formato); set('i-vagas', c.vagas); set('i-premio', c.premiacao);

      var tag = document.getElementById('i-tag');
      var ROTULOS = { aberta: 'Inscrições abertas', andamento: 'Em andamento', encerrado: 'Encerrado' };
      tag.textContent = ROTULOS[c.status];
      tag.classList.add('tag-' + c.status);

      c.regras.forEach(function (r) { document.getElementById('i-regras').appendChild(el('li', '', r)); });

      if (c.chave) {
        document.getElementById('i-chave-bloco').hidden = false;
        c.chave.forEach(function (f) {
          var fase = el('div', 'fase');
          fase.appendChild(el('small', '', f.fase));
          f.times.forEach(function (t) { fase.appendChild(el('div', 'time', t)); });
          document.getElementById('i-chave').appendChild(fase);
        });
      } else {
        document.getElementById('i-regras-chave').style.gridTemplateColumns = '1fr';
      }

      var btn = document.getElementById('confirmar-inscricao');
      if (c.status !== 'aberta') {
        btn.textContent = c.status === 'andamento' ? 'Campeonato em andamento' : 'Inscrições encerradas';
        btn.disabled = true;
      } else {
        btn.addEventListener('click', function () {
          btn.textContent = 'Inscrição confirmada ✓';
          btn.disabled = true;
        });
      }
    }
  </script>
</body>
</html>
