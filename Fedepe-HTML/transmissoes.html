<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transmissões - Copa FEDEPE</title>
  <link rel="icon" href="img/logo-fedepe.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-pagina="transmissoes">
  <div id="app-header"></div>

  <main class="pagina-larga">
    <h1>Transmissões oficiais</h1>
    <p class="subtitulo">Acompanhe as partidas ao vivo e reveja os grandes momentos da Copa FEDEPE</p>

    <!-- O link do vídeo é definido pelo ADM em admin.html → Gerenciar transmissão -->
    <div class="player thumb" id="player"></div>
    <div class="player-info">
      <div>
        <span class="tag-live vivo" id="live-tag"></span>
        <h2 id="live-titulo"></h2>
        <p id="live-desc"></p>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button type="button" class="btn btn-borda btn-pequeno" id="voltar-live" hidden>● Voltar ao vivo</button>
        <a href="#" target="_blank" rel="noopener" class="btn btn-youtube btn-pequeno" id="canal">▶ Canal no YouTube</a>
      </div>
    </div>

    <div class="secao-topo">
      <div><h2 class="titulo-secao">Partidas gravadas</h2><p class="subtitulo">Reprises e melhores momentos</p></div>
    </div>
    <div class="linha-chips"><div id="filtros" role="group" aria-label="Filtrar por jogo"></div></div>
    <div class="grade-videos" id="grade"></div>
  </main>

  <div id="app-footer"></div>

  <script src="js/mock/database.js"></script>
  <script src="js/services/mockApi.js"></script>
  <script src="js/ui/layout.js"></script>
  <script>
    (async function () {
      await UI.iniciar();
      var el = UI.el;
      var dados = await Api.transmissoes();
      var live = dados.aoVivo, vods = dados.vods;
      var esp = live.espectadores || 900, filtro = 'todos', atual = null;
      var player = document.getElementById('player');

      // destaque = transmissão oficial configurada pelo ADM (ao vivo ou gravada)
      function tocar(v, destaque) {
        atual = v;
        var aoVivo = destaque && v.aoVivo !== false;
        var tag = document.getElementById('live-tag');
        tag.textContent = (aoVivo ? '● AO VIVO · ' : destaque ? 'TRANSMISSÃO OFICIAL · GRAVADO · ' : 'REPRISE · ') + Api.JOGOS[v.jogo].caps;
        tag.className = 'tag-live ' + (aoVivo ? 'vivo' : 'reprise');
        document.getElementById('live-titulo').textContent = v.titulo;
        document.getElementById('live-desc').textContent = destaque ? (v.descricao || '') : ('Transmitido em ' + UI.data(v.data) + ' · ' + v.duracao + ' · ' + UI.numero(v.views) + ' visualizações');
        document.getElementById('voltar-live').hidden = destaque;
        document.getElementById('voltar-live').textContent = live.aoVivo === false ? '★ Voltar à transmissão oficial' : '● Voltar ao vivo';
        var canal = document.getElementById('canal');
        canal.href = v.url || live.canal;
        canal.textContent = v.url ? (v.plataforma === 'twitch' ? '▶ Abrir na Twitch' : '▶ Abrir no YouTube') : '▶ Canal no YouTube';
        canal.classList.toggle('btn-twitch', v.plataforma === 'twitch');
        player.className = 'player thumb ' + v.jogo;
        player.style.backgroundImage = '';
        player.innerHTML = '';
        var modo = UI.player(player, v);
        if (modo !== 'vazio') {
          if (aoVivo) player.appendChild(el('span', { class: 'ao-vivo', text: 'AO VIVO' }));
          else if (destaque) player.appendChild(el('span', { class: 'gravado', text: 'GRAVADO' }));
        } else {
          if (aoVivo) {
            player.appendChild(el('span', { class: 'ao-vivo', text: 'AO VIVO' }));
            player.appendChild(el('span', { class: 'espectadores', id: 'esp', text: '👁 ' + UI.numero(esp) + ' assistindo' }));
          } else if (destaque) player.appendChild(el('span', { class: 'gravado', text: 'GRAVADO' }));
          var play = el('button', { type: 'button', class: 'play', 'aria-label': 'Reproduzir', text: '▶' });
          play.addEventListener('click', function () { UI.toast('Demonstração: o ADM pode anexar o link do YouTube ou da Twitch em Painel ADM → Gerenciar transmissão.'); });
          player.appendChild(play);
          if (v.timeA) player.appendChild(el('div', { class: 'player-placar' }, [
            el('span', { text: v.timeA }),
            el('span', { class: 'placar', text: aoVivo && v.placar ? v.placar : 'VS' }),
            el('span', { text: v.timeB }),
            aoVivo && v.mapa ? el('small', { text: v.mapa }) : null
          ]));
        }
        document.querySelectorAll('.video-card').forEach(function (c) { c.classList.toggle('tocando', c.dataset.id === v.id); });
      }

      function renderFiltros() {
        var box = document.getElementById('filtros'); box.innerHTML = '';
        [['todos', 'Todos']].concat(Object.keys(Api.JOGOS).map(function (k) { return [k, Api.JOGOS[k].curto]; })).forEach(function (o) {
          var b = el('button', { type: 'button', class: 'chip' + (filtro === o[0] ? ' ativo' : ''), 'aria-pressed': String(filtro === o[0]), text: o[1] });
          b.addEventListener('click', function () { filtro = o[0]; renderFiltros(); renderGrade(); });
          box.appendChild(b);
        });
      }

      function renderGrade() {
        var grade = document.getElementById('grade'); grade.innerHTML = '';
        var lista = vods.filter(function (v) { return filtro === 'todos' || v.jogo === filtro; });
        if (!lista.length) grade.appendChild(UI.vazio('Nenhuma partida gravada para este jogo ainda'));
        lista.forEach(function (v) {
          var c = el('button', { type: 'button', class: 'video-card' + (atual && atual.id === v.id ? ' tocando' : ''), 'data-id': v.id, 'aria-label': 'Assistir: ' + v.titulo }, [
            el('div', { class: 'thumb ' + v.jogo + (v.thumb ? ' com-foto' : ''), style: v.thumb ? 'background-image:url("' + v.thumb + '"), url("img/banner-' + v.jogo + '.jpg")' : null }, [
              el('span', { class: 'icone ' + v.jogo }),
              v.thumb ? null : el('span', { class: 'versus' }, [v.timeA, el('i', { text: 'VS' }), v.timeB]),
              v.url ? null : el('span', { class: 'sem-video', text: 'Vídeo em breve' }),
              el('span', { class: 'mini-play', text: '▶' }),
              el('span', { class: 'duracao', text: v.duracao })
            ]),
            el('div', { class: 'video-info' }, [
              el('small', { class: 'jogo cor-' + v.jogo, text: Api.JOGOS[v.jogo].caps }),
              el('strong', { text: v.titulo }),
              el('small', { class: 'data', text: UI.data(v.data) + ' · ' + UI.numero(v.views) + ' visualizações' })
            ])
          ]);
          c.addEventListener('click', function () { tocar(v, false); window.scrollTo({ top: 0, behavior: 'smooth' }); });
          grade.appendChild(c);
        });
      }

      document.getElementById('voltar-live').addEventListener('click', function () { tocar(live, true); });
      // Se o ADM trocar a transmissão em outra aba, o player principal atualiza sozinho
      Api.aoMudar(async function (d) {
        if (d.origem !== 'outra-aba') return;
        var dadosNovos = await Api.transmissoes();
        if (JSON.stringify(dadosNovos.vods) !== JSON.stringify(vods)) { vods = dadosNovos.vods; renderGrade(); }
        var novo = dadosNovos.aoVivo;
        if (JSON.stringify(novo) === JSON.stringify(live)) return;
        live = novo;
        if (!atual || atual.id === live.id) tocar(live, true);
        UI.toast('Transmissão oficial atualizada: ' + live.titulo, 'sucesso');
      });
      setInterval(function () {
        esp = Math.max(300, esp + Math.round((Math.random() - 0.4) * 24));
        var e = document.getElementById('esp'); if (e) e.textContent = '👁 ' + UI.numero(esp) + ' assistindo';
      }, 3000);

      renderFiltros(); renderGrade(); tocar(live, true);
    })();
  </script>
</body>
</html>
