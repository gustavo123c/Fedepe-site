<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transmissões - Copa FEDEPE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">Copa FEDEPE de Esports</div>
    <nav>
      <a href="index.html">Início</a>
      <a href="campeonatos.html">Campeonatos</a>
      <a href="transmissoes.html" class="ativo">Transmissões</a>
      <a href="ranking.html">Ranking</a>
      <a href="login.html" class="btn btn-amarelo btn-pequeno">Entrar</a>
    </nav>
  </header>

  <main class="pagina-larga">
    <h1>Transmissões oficiais</h1>
    <p class="subtitulo">Acompanhe as partidas ao vivo e reveja os grandes momentos</p>

    <!-- Player principal. Para vídeo real: preencha "youtube" (ID do vídeo) em AO_VIVO no script -->
    <div class="player" id="player">▶</div>
    <div class="player-info">
      <div>
        <span class="tag-live" id="live-tag">● AO VIVO · VALORANT</span>
        <h2 id="live-titulo"></h2>
        <p id="live-desc"></p>
      </div>
      <a href="https://www.youtube.com/" target="_blank" rel="noopener" class="btn btn-amarelo btn-pequeno">Canal no YouTube</a>
    </div>

    <div class="linha-chips" id="filtros">
      <div>
        <span class="chip ativo" data-jogo="todos">Todos</span>
        <span class="chip" data-jogo="valorant">Valorant</span>
        <span class="chip" data-jogo="lol">LoL</span>
        <span class="chip" data-jogo="fortnite">Fortnite</span>
        <span class="chip" data-jogo="cs2">CS2</span>
      </div>
    </div>

    <div class="grade-videos" id="grade"></div>
  </main>

  <footer class="rodape">
    <strong>Copa FEDEPE de Esports</strong>
    <small>Pernambuco · Temporada 2026</small>
  </footer>

  <script src="auth.js"></script>
  <script>
    var NOMES = { valorant: 'VALORANT', lol: 'LEAGUE OF LEGENDS', fortnite: 'FORTNITE', cs2: 'CS2' };

    // youtube: ID do vídeo (ex.: 'dQw4w9WgXcQ'). Vazio = mostra o placeholder.
    var AO_VIVO = { jogo: 'valorant', youtube: '', titulo: 'Grand Final — Copa FEDEPE Valorant Abertura DAMAS x GGE',
      descricao: 'A grande final da Copa FEDEPE Valorant 2026 Abertura. Colégio DAMAS x GGE em uma partida épica de Ascent.' };

    var VIDEOS = [
      { jogo: 'lol',      youtube: '', titulo: 'Semifinal Liga LoL — CEFET-PE vs EREM Carneiro', data: '10 Out 2026' },
      { jogo: 'cs2',      youtube: '', titulo: 'Torneio CS2 — Fase Suíça Rodada 3',              data: '08 Out 2026' },
      { jogo: 'fortnite', youtube: '', titulo: 'Copa Fortnite Solo — Melhores Momentos',         data: '05 Out 2026' },
      { jogo: 'valorant', youtube: '', titulo: 'Quartas de Final — FEDEPE Open Duos',            data: '02 Out 2026' },
      { jogo: 'lol',      youtube: '', titulo: 'Análise Tática: Fase de Grupos Liga LoL',        data: '29 Set 2026' }
    ];

    var player = document.getElementById('player');

    function tocar(v, aoVivo) {
      document.getElementById('live-tag').textContent = (aoVivo ? '● AO VIVO · ' : 'REPRISE · ') + NOMES[v.jogo];
      document.getElementById('live-titulo').textContent = v.titulo;
      document.getElementById('live-desc').textContent = v.descricao || ('Transmitido em ' + v.data + '.');
      player.innerHTML = '';
      if (v.youtube && /^[\w-]{6,20}$/.test(v.youtube)) {
        var f = document.createElement('iframe');
        f.src = 'https://www.youtube.com/embed/' + v.youtube;
        f.allowFullscreen = true; f.title = v.titulo;
        player.appendChild(f);
      } else { player.textContent = '▶'; }
    }

    var grade = document.getElementById('grade');
    VIDEOS.forEach(function (v) {
      var c = document.createElement('div');
      c.className = 'video-card'; c.dataset.jogo = v.jogo;
      c.innerHTML = '<div class="thumb ' + v.jogo + '"><span>▶</span></div>' +
        '<div class="video-info"><small class="jogo ' + v.jogo + '-txt">' + NOMES[v.jogo] + '</small>' +
        '<strong></strong><small class="data">' + v.data + '</small></div>';
      c.querySelector('strong').textContent = v.titulo;
      c.addEventListener('click', function () { tocar(v, false); window.scrollTo({ top: 0, behavior: 'smooth' }); });
      grade.appendChild(c);
    });

    document.querySelectorAll('#filtros .chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        document.querySelectorAll('#filtros .chip').forEach(function (c) { c.classList.toggle('ativo', c === chip); });
        document.querySelectorAll('.video-card').forEach(function (card) {
          card.style.display = (chip.dataset.jogo === 'todos' || card.dataset.jogo === chip.dataset.jogo) ? '' : 'none';
        });
      });
    });

    tocar(AO_VIVO, true);
  </script>
</body>
</html>
